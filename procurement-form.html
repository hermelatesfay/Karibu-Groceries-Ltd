<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Form</title>
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />

    <link href="fa/css/fontawesome.css" rel="stylesheet" />
    <link href="fa/css/brands.css" rel="stylesheet" />
    <link href="fa/css/solid.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="procurement-container">
        <div class="procurementnav">
            <div class="logoCompanyName">
                <div class="logo">
                    <img class="logo-pic" src="images/img3.jpg" alt="logo" />
                </div>
                <div class="companyname-procurement">
                    <h2>Karibu Groceries</h2>
                </div>
            </div>
            <div class="searchbar">
                <div class="searchinput">
                    <input type="search" placeholder="Search" >
                </div>
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="navlist">
                <ul id="nav">
                    <li><a href="manager-dashboard.html">Dashboard</a></li>
                    <li><a href="">Inventory</a></li>
                    <li><a href="managerSale.html">Sales</a></li>
                    <li><a href="procurement-form.html">Procurement</a></li>
                    <li><a href="">Reports</a></li>
                    
                </ul>
            </div>
            
            <div class="profile-pic">
                <img src="images/img4.avif" alt="profile" />
            </div>
            
        </div>
        <div class="procurementForm">
            <div class="contentlinks">
                <p><a href="">Home</a> / <a href="">Procurement / <a href="procurement-form.html">New Entry</a></a></p>
            </div>
            <div class="procurementHead">
                <div class="procurementHeading">
                    <h1>New Produce Procurement</h1>
                    <p>Record incoming stock for auditing and inventory management</p>
                </div>
                <div class="import">
                    <button><i class="fa-solid fa-download"></i> Import CSV</button>
                    
                </div>
            </div>
                
            <div class="form-container">
                <form action="" id="form">
                    <div class="produceContainer">
                        <div class="producehead">
                            <div class="produce-icon">
                                <i class="fa-solid fa-tractor"></i>
                            </div>
                            <div class="produceHeading">
                                <h3>Produce Details</h3>
                            </div>
                        
                        </div>
                 
                        <div class="produce-details">
                            <div class="produce-name">
                                <label for="">Produce Name</label><br>
                                <select name="" id="produceName">
                                    <option value="">Select Produce</option>
                                    <option value="Beans">Beans</option>
                                    <option value="Grain Maize">Grain Maize</option>
                                    <option value="Cow peas">Cow peas</option>
                                    <option value="Soybeans">Soybeans</option>
                                    <option value="G-nuts">G-nuts</option>
                                </select>
                            </div>
                       

                        
                            <div class="produce-Type">
                                <label for="">Produce Type</label><br>
                                <select name="" id="produceType">
                                    <option value="">Select Type</option>
                                    <option value="Cereal Grain">Cereal Grain</option>
                                    <option value="Grain Legume">Grain Legume</option>
                                    <option value="Oilseed Legume">Oilseed Legume</option>
                                </select>
                            </div>
                            <div class="tonnage">
                                <label for="">Tonnage (kg)</label><br>
                                <input id="tonnage" type="text" placeholder="e.g. 5000">
                                <div class="unit">KG</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="financeContainer">
                        <div class="financehead">
                            <div class="finance-icon">
                               <i class="fa-solid fa-money-bill"></i>
                            </div>
                            <div class="finance-Heading">
                                <h3>Financials</h3>
                            </div>
                        
                        </div>
                        <div class="finance-details">

                            <div class="totalcost">
                                <label for="">Total cost(Buying Price)</label><br>
                                <input id="totalCost" type="number" placeholder="0.00">
                                <p>UGX</p>
                            </div>
                            <div class="salePrice">
                                <label for="">Target Sale Price (Per Kg)</label><br>
                                <input id="salePrice"type="number" placeholder="0.00">
                                <p>UGX</p>
                            </div>
                        
                        </div>
                    </div>
                    
                    <div class="supplierContainer">
                        <div class="supplierhead">
                            <div class="supplier-icon">
                                <i class="fa-solid fa-truck"></i>
                            </div>
                            <div class="supplier-Heading">
                                <h3>Supplier & logistics</h3>
                            </div>
                        
                        </div>
                        <div class="supplier-details">
                            <div class="dealer-details1">
                                <div class="dealerName">
                                    <label for="">Dealer Name</label>
                                    <input id="dealerName" type="text" placeholder="Enter dealer name">
                                </div>
                                <div class="contactInfo">
                                    <label for="">Contact Information</label>
                                    <input id="contactInfo" type="tel" placeholder="256700000000">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                            </div>
                        </div>
                        <div class="dealer-details2">
                            <div class="branch">
                                <label for="">Receiving Branch</label><br>
                                <select name="" id="branch">
                                    <option value="">Select a branch</option>
                                    <option value="Maganjo">Maganjo</option>
                                    <option value="Matugga">Matugga</option>
                                </select>
                            </div>
                            <div class="date-time">
                                <label for="">Date & Time of Arrival</label><br>
                                <input id="dateTime" type="datetime-local" placeholder="mm/dd/yyyy --:-- --">
                            </div>
                        </div>
                    </div>
                    

                    <div class="submitButton">
                        <div class="cancel">
                            <a href=""><p>Cancel</p></a>
                        </div>
                        <div class="submit">
                            <button type="submit">Submit Procurement</button>
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                    </div>
                        
                    
                    
            
                </form>
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
