<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Form</title>
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="procurement-container">
        <div class="procurementnav">
            <div class="kgllogo">
                <i class="bx bx-leaf-alt"></i>
                <h3>Karibu Groceries</h3>
            </div>
            <div class="searchbar">
                <div class="searchinput">
                    <input type="search" placeholder="Search" >
                </div>
            </div>
            <div class="navlist">
                <ul>
                    <li><a href="">Dashboard</a></li>
                    <li><a href="">Inventory</a></li>
                    <li><a href="">Sales</a></li>
                    <li><a href="">Procurement</a></li>
                    <li><a href="">Reports</a></li>
                </ul>
            </div>
            <div class="userprofile">
                <img src="" alt="">
            </div>
        </div>
        <div class="procurementForm">
            <div class="contentlinks">
                <p><a href="">Home</a> / <a href="">Procurement / <a href="">New Entry</a></a></p>
            </div>
            <div class="procurementHead">
                <div class="procurementHeading">
                    <h2>New Produce Procurement</h2>
                    <p>Record incoming stock for auditing and inventory management</p>
                </div>
                <div class="import">
                    <button>Import CSV</button>
                </div>
                <div class="form-container">
                    <div class="producehead">
                        <div class="produce-icon"></div>
                        <div class="produceHeading">
                            <h3>Produce Details</h3>
                        </div>
                        
                    </div>
                     <div class="produceContainer">
                        
                     </div>
                    <div class="produce-details">
                        <div class="produce-name">
                            <label for="">Produce Name</label>
                            <select name="" id="">
                                <option value="">Select Produce</option>
                                <option value="">Beans</option>
                                <option value="">Grain Maize</option>
                                <option value="">Cow peas</option>
                                <option value="">Soybeans</option>
                                <option value="">G-nuts</option>
                            </select>
                        </div>
                       

                        </div>
                        <div class="produce-Type">
                            <label for="">Produce Type</label>
                            <select name="" id="">
                                <option value="">Select Quality</option>
                                <option value=""></option>
                                <option value=""></option>
                                <option value=""></option>
                            </select>
                        </div>
                        <div class="tonnage">
                            <label for="">Tonnage (kg)</label>
                            <input type="text" placeholder="e.g. 5000">
                            <div class="unit">KG</div>
                        </div>
                    </div>

                     <div class="finance-details">

                        <div class="Totalcost">
                            <label for="">Total cost(Buying Price)</label>
                            <input type="number" placeholder="0.00">
                        </div>
                        <div class="salePrice">
                            <label for="">Target Sale Price (Per Kg)</label>
                            <input type="number" placeholder="0.00">
                        </div>
                        
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
