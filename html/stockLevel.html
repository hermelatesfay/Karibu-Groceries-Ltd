<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karibu Groceries stock level</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<link rel="stylesheet" href="../css/stockLevel.css">

  <link rel="stylesheet" href="../css/sidebar.css">


</head>

<body data-role="Manager">

<div class="wrapper">

<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- MAIN CONTENT -->
<div class="main">

<div class="header">

<div>
<h2>Stock Levels</h2>
<p>View all cereal stock levels</p>
</div>

<div class="header-actions">

<div class="notification">
<span class="material-symbols-outlined">notifications</span>
<div class="notification-dot"></div>
</div>

</div>
</div>


<div class="content">

  
<!-- SUMMARY CARDS -->
<div class="cards">

<div class="card">
<div class="card-header">
<p>Total Produce</p>
<span class="material-symbols-outlined">inventory_2</span>
</div>
<!-- <h2>1,240 <small style="font-size:14px;color:#618968;font-weight:normal;">Tons</small></h2> -->
</div>

<div class="card">
<div class="card-header">
<p>Branches Active</p>
<span class="material-symbols-outlined">location_on</span>
</div>
<!-- <h2>12 <small style="font-size:14px;color:#618968;font-weight:normal;">Units</small></h2> -->
</div>

<div class="card">
<div class="card-header">
<p>Low Stock Alert</p>
<span class="material-symbols-outlined warning">warning</span>
</div>
<!-- <h2>8 <small style="font-size:14px;color:#618968;font-weight:normal;">Items</small></h2> -->
</div>

<div class="card">
<div class="card-header">
<p>Out of Stock</p>
<span class="material-symbols-outlined danger">error_outline</span>
</div>
<!-- <h2>2 <small style="font-size:14px;color:#618968;font-weight:normal;">Critical</small></h2> -->
</div>

</div>



<!-- TABLE -->
<div class="table-container">
<div class="table-header">
<h3>Detailed Stock List</h3>
<div class="table-buttons">
<button class="btn"><span class="material-symbols-outlined">filter_list</span>Filter</button>
<button class="btn primary"><span class="material-symbols-outlined">add</span>New Item</button>
</div>
</div>

<table>
<thead>
<tr>
<th>Produce Item</th>
<th>Category</th>
<th>Stock Level</th>
<th>Location</th>
<th>Status</th>
<th style="text-align:right;">Action</th>
</tr>
</thead>

<tbody id="stockTableBody"></tbody>

</table>

<div class="pagination">
<p>Showing 5 of 5 products</p>
<div class="pagination-buttons" id="pagination">

</div>
</div>

</div>

</main>

</div>
<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>


</div>

</div>

</div>

<script src="../js/auth.js"></script>
<script src="../js/sidebar.js"></script>
<script type="module"src="../js/stockLevel.js"></script>


</body>
</html>
